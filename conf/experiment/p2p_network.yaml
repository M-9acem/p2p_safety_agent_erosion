# @package experiment
# Phase 2 (machinery + acceptance checks) / Phase 3+ (RQ1, RQ2): full P2P
# round loop across the configured graph.
name: p2p_network

n_rounds: 40
local_steps: 20
eval_every_round: 5  # "every K rounds" per spec section 4
n_eval_prompts: 50

train:
  lr: 2e-4
  batch_size: 8
  grad_accum: 1

# "params" averages LoRA A and B separately (cheap, technically wrong).
# "delta" materializes per-module dW = (alpha/r) * B @ A, averages dW,
# and refactors back to rank r via truncated SVD (correct, slower).
# Run the main experiment in "delta"; comparing the two is a secondary result.
average_mode: delta

# Phase 2 acceptance check knob: every agent trains on the FULL task
# corpus instead of a Dirichlet partition, isolating the averaging
# machinery's convergence behavior from any effect of differing data.
identical_data: false

# Resume from a previous (crashed/timed-out) run's checkpoint dir, e.g.
# ".../outputs/2026-.../p2p_network/checkpoints/latest" — reads round.txt
# there to know which round to continue from. null = start fresh at
# round 0.
resume_from: null

# spec section 6's full per-agent-per-round metric set (benign refusal
# rate, MMLU subset, held-out task F1) beyond ASR/drift — real added eval
# cost per round, so off by default for large sweeps (phase 3, a rank
# sweep, replication) and turned on explicitly for smaller/higher-value
# runs (rq3) where the extra signal is worth the time.
full_metrics: false
mmlu_subset_size: 20
n_held_out_task_examples: 20
# reserved from the END of the task dataset, before Dirichlet partitioning
# — never seen by any agent's training shard, used for both benign
# refusal rate and the held-out task F1 metric above.
n_held_out_reserve: 50
