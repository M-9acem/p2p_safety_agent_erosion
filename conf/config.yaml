defaults:
  - model: qwen2.5-1.5b
  - graph: ring
  - data: alpaca
  - experiment: single_agent
  - _self_

seed: 0
device: cuda

wandb:
  project: p2p-safety
  entity: null
  # "offline" until `wandb login` / WANDB_API_KEY is set up on the runner
  # (not yet, on the cluster) — writes local run data, syncs later with
  # `wandb sync`. Override with wandb.mode=online once logged in.
  mode: offline

output_dir: ${hydra:runtime.output_dir}
